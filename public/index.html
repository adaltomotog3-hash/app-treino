<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FERRO — Diário de Treino</title>
<meta name="theme-color" content="#FF4B26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FERRO" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/ferro-192.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="tela-login" class="tela-login">
  <div class="login-aura" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-eyebrow">Sistema de treino</div>
    <div class="login-marca">FERRO<span>.</span></div>
    <p class="login-sub">Entre com sua conta para começar o treino de hoje</p>
    <form id="form-login" class="login-form">
      <div class="campo campo-login">
        <label for="login-usuario">Usuário</label>
        <input type="text" id="login-usuario" autocomplete="username" placeholder="ex: Adalto" required>
      </div>
      <div class="campo campo-login">
        <label for="login-senha">Senha</label>
        <div class="campo-senha-wrap">
          <input type="password" id="login-senha" autocomplete="current-password" placeholder="••••" required>
          <button type="button" class="btn-olho" id="btn-mostrar-senha" aria-label="Mostrar senha" title="Mostrar senha">
            <svg id="icone-olho" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="login-erro oculto" id="login-erro"></div>
      <button type="submit" class="btn-primario btn-login" id="btn-login-submit">Entrar</button>
    </form>
    <p class="login-rodape">Não tem conta? Fale com o administrador da sua academia para criar seu acesso.</p>
  </div>
  <div class="login-marca-rodape">FERRO<span>.</span> — gestão de treino para academias</div>
</div>

<!-- Modal: criar novo usuário -->
<div id="modal-criar-usuario" class="overlay oculto">
  <div class="modal-card">
    <div class="modal-topo">
      <h2>Criar usuário</h2>
      <button class="modal-fechar" data-fechar="modal-criar-usuario">✕</button>
    </div>
    <form id="form-criar-usuario">
      <div class="campo campo-full">
        <label for="cu-usuario">Login (sem espaços)</label>
        <input type="text" id="cu-usuario" placeholder="ex: Joao" required>
      </div>
      <div class="campo campo-full">
        <label for="cu-nome">Nome de exibição</label>
        <input type="text" id="cu-nome" placeholder="ex: João" required>
      </div>
      <div class="campo campo-full">
        <label for="cu-senha">Senha</label>
        <input type="password" id="cu-senha" placeholder="mínimo 3 caracteres" required>
      </div>
      <div class="campo campo-full">
        <label for="cu-genero">Treino baseado em</label>
        <select id="cu-genero">
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
        </select>
      </div>
      <div class="campo campo-full">
        <label for="cu-dias">Dias de treino por semana</label>
        <select id="cu-dias">
          <option value="3">3 dias</option>
          <option value="4">4 dias</option>
          <option value="5">5 dias</option>
        </select>
      </div>
      <div class="login-erro oculto" id="cu-erro"></div>
      <div class="modal-acoes">
        <button type="submit" class="btn-primario">Criar usuário</button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="app oculto">

  <header class="topo">
    <div class="topo-marca">FERRO<span>.</span></div>
    <div class="topo-info">
      <div class="topo-data" id="data-hoje"></div>
      <div class="topo-sugestao" id="sugestao-hoje"></div>
    </div>
    <button class="chip-usuario" id="btn-abrir-perfil">
      <span class="avatar avatar-sm" id="avatar-atual">A</span>
      <span id="nome-atual">Adalto</span>
      <span class="trocar">perfil</span>
    </button>
  </header>

  <nav class="abas" id="abas-principais"></nav>

  <main id="conteudo"></main>

</div>

<!-- Modal: perfil (nome, senha, foto, dias de treino) -->
<div id="modal-perfil" class="overlay oculto">
  <div class="modal-card">
    <div class="modal-topo">
      <h2>Meu perfil</h2>
      <button class="modal-fechar" data-fechar="modal-perfil">✕</button>
    </div>

    <div class="perfil-foto-wrap">
      <div class="perfil-foto" id="perfil-foto-preview">A</div>
      <label class="btn-secundario btn-upload-foto" for="perfil-foto-input">Trocar foto</label>
      <input type="file" id="perfil-foto-input" accept="image/*" class="oculto">
    </div>

    <form id="form-perfil-nome">
      <div class="campo campo-full">
        <label for="pf-nome">Nome de exibição</label>
        <input type="text" id="pf-nome" required>
      </div>
      <div class="campo campo-full">
        <label for="pf-dias">Dias de treino por semana</label>
        <select id="pf-dias">
          <option value="3">3 dias</option>
          <option value="4">4 dias</option>
          <option value="5">5 dias</option>
        </select>
      </div>
      <div class="perfil-preferencias">
        <div class="campo campo-full">
          <label for="pf-status">Meu status</label>
          <select id="pf-status">
            <option value="Disponível">Disponível</option>
            <option value="Ocupado">Ocupado</option>
            <option value="Ausente">Ausente</option>
          </select>
        </div>
        <div class="campo campo-full">
          <label for="pf-status-visibilidade">Quem pode ver</label>
          <select id="pf-status-visibilidade">
            <option value="amigos">Somente amigos</option>
            <option value="todos">Todos os usuários</option>
          </select>
        </div>
      </div>
      <div class="modal-acoes">
        <button type="submit" class="btn-primario">Salvar</button>
      </div>
    </form>

    <hr class="modal-divisor">

    <form id="form-perfil-senha">
      <h3 class="modal-subtitulo">Trocar senha</h3>
      <div class="campo campo-full">
        <label for="pf-senha-atual">Senha atual</label>
        <input type="password" id="pf-senha-atual" required>
      </div>
      <div class="campo campo-full">
        <label for="pf-senha-nova">Nova senha</label>
        <input type="password" id="pf-senha-nova" placeholder="mínimo 3 caracteres" required>
      </div>
      <div class="login-erro oculto" id="pf-senha-erro"></div>
      <div class="modal-acoes">
        <button type="submit" class="btn-secundario">Trocar senha</button>
      </div>
    </form>

    <div id="secao-admin" class="secao-admin oculto">
      <hr class="modal-divisor">
      <h3 class="modal-subtitulo">Administração da academia</h3>
      <div id="admin-lista-usuarios" class="admin-lista-usuarios"></div>
      <button class="btn-secundario btn-admin-add" id="btn-abrir-criar-usuario-2">+ Adicionar usuário</button>
    </div>

    <hr class="modal-divisor">
    <button class="link-discreto link-sair" id="btn-trocar-usuario">Sair da conta</button>
  </div>
</div>

<!-- Overlay de cronômetro de descanso -->
<div id="overlay-cronometro" class="overlay oculto">
  <div class="cronometro-card">
    <div class="cronometro-label" id="cronometro-exercicio">Descanso</div>
    <div class="cronometro-numero" id="cronometro-numero">01:30</div>
    <div class="cronometro-barra"><div class="cronometro-barra-fill" id="cronometro-barra-fill"></div></div>
    <div class="cronometro-acoes">
      <button id="btn-cronometro-mais10" class="btn-secundario">+10s</button>
      <button id="btn-cronometro-pausar" class="btn-secundario">Pausar</button>
      <button id="btn-cronometro-concluir" class="btn-primario">Concluí o descanso</button>
    </div>
  </div>
</div>
